[project]
name = "ge-agent-gateway-mcp"
version = "1.0.0"
description = "Qwiklabs-Style Hands-On Demo Repository for Gemini Enterprise with AWS Custom MCP Servers, Agent Registry, Egress Agent Gateway, Cloud Armor, Model Armor, and Sensitive Data Protection (SDP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=2.2.0",
    "google-auth>=2.29.0",
    "google-auth-httplib2>=0.2.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-dlp>=3.16.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-resource-manager>=1.12.0",
    "google-cloud-storage>=2.16.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "mock_aws_mcp_servers"]
